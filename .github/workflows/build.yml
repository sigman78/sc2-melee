name: build

# A branch with a PR open matches both `push` and `pull_request`, which ran
# the whole matrix twice. `pull_request` is the one kept: it builds the merge
# result, which is what actually lands. `push` stays for main only, so a
# merge is still checked.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and macOS install the dependencies, exercising the
          # find_package half of find-or-fetch. Windows installs nothing,
          # exercising the fetch half. Between them both paths stay honest.
          - { os: ubuntu-latest, name: 'linux (gcc, system deps)' }
          - { os: macos-latest, name: 'macos (clang, system deps)' }
          - { os: windows-latest, name: 'windows (msvc, fetched deps)' }

    steps:
      - uses: actions/checkout@v4

      # libsdl3-dev is not in the runner images yet, so SDL3 is built from
      # source here and needs its own X11/Wayland build dependencies.
      - name: Install build tools and dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libpng-dev zlib1g-dev libogg-dev libvorbis-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev

      - name: Install build tools and dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Ninja needs the MSVC environment; the Visual Studio generator would
      # not. Pinned to the v1.9.0 commit rather than the moving tag.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/dev/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      # replay_test is the one that matters: it runs 32 battles to completion
      # and compares against the recorded baseline, so a behaviour change
      # anywhere in sim/ fails here.
      - name: Test
        run: ctest --preset dev --output-on-failure

  # Format only. clang-tidy used to run here too and cost ~8 minutes of
  # hosted runner per push, for an answer that never depends on the
  # platform; it is a pre-push hook now (CLAUDE.md). Formatting is seconds
  # and worth having a second opinion on.
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not the runner image's: clang-format's output moves between
      # majors, so an unpinned tool reports violations on lines nobody
      # touched. tools/clang-env.sh names the same version locally.
      - name: Install clang-format
        run: pipx install clang-format==21.1.5

      # The same check .githooks/pre-commit runs, over everything.
      - name: Format
        run: |
          files=$(git ls-files 'src/*.cpp' 'src/*.hpp' 'tests/*.cpp' 'tests/*.hpp')
          clang-format --dry-run -Werror $files
