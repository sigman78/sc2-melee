name: build

# A branch with a PR open matches both `push` and `pull_request`, which ran
# the whole matrix twice. `pull_request` is the one kept: it builds the merge
# result, which is what actually lands. `push` stays for main only, so a
# merge is still checked.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and macOS install the dependencies, exercising the
          # find_package half of find-or-fetch. Windows installs nothing,
          # exercising the fetch half. Between them both paths stay honest.
          - { os: ubuntu-latest, name: 'linux (gcc, system deps)' }
          - { os: macos-latest, name: 'macos (clang, system deps)' }
          - { os: windows-latest, name: 'windows (msvc, fetched deps)' }

    steps:
      - uses: actions/checkout@v4

      # libsdl3-dev is not in the runner images yet, so SDL3 is built from
      # source here and needs its own X11/Wayland build dependencies.
      - name: Install build tools and dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libpng-dev zlib1g-dev libogg-dev libvorbis-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev

      - name: Install build tools and dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Ninja needs the MSVC environment; the Visual Studio generator would
      # not. Pinned to the v1.9.0 commit rather than the moving tag.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/dev/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      # coroutine_test pins the resume semantics of libs/coroutine.h, which
      # every Phase 2 conversion is written in. Building it is not enough --
      # Duff's device can compile everywhere and still resume wrongly.
      - name: Test
        run: ctest --preset dev --output-on-failure

      # Exercises option parsing and startup without needing content.
      # SC2M_NO_MSGBOX matters: on Windows and macOS the end-of-run log box is
      # a modal dialog and would hang the job forever.

  lint:
    name: format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             cmake ninja-build             libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev             libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev             libwayland-dev wayland-protocols libdecor-0-dev             libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev

      # Pinned, not the runner image's: its clang 18 fails on this tree for
      # version reasons alone -- clang-format's output moves between majors,
      # so it flags lines nobody touched, and clang-tidy 18 rejects
      # .clang-tidy's ExcludeHeaderFilterRegex (19+) and cannot parse
      # std::expected out of libstdc++ 13.
      #
      # Wheels rather than apt.llvm.org: the same binaries, installed in
      # seconds instead of minutes, and available on every platform, so a
      # developer can hold the exact version CI holds. tools/clang-env.sh
      # names them and warns when a local tool drifts.
      - name: Install pinned clang tooling
        run: pipx install clang-format==21.1.5 && pipx install clang-tidy==21.1.6

      # The same check .githooks/pre-commit runs, over everything.
      - name: Format
        run: |
          files=$(git ls-files 'src/*.cpp' 'src/*.hpp' 'tests/*.cpp' 'tests/*.hpp')
          clang-format-21 --dry-run -Werror $files

      # Too slow for a pre-commit hook, which is why it lives here.
      - name: Lint
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug             -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          for f in $(git ls-files 'src/*.cpp' 'tests/*.cpp'); do
            clang-tidy-21 -p build "$f" --quiet --warnings-as-errors='*'
          done
