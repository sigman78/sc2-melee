<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ur-Quan Masters — melee</title>
<style>
	:root { color-scheme: dark; }
	html, body {
		margin: 0;
		height: 100%;
		background: #05050c;
		color: #b8b8c8;
		font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	}
	body {
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 1rem;
		padding: 1rem;
		box-sizing: border-box;
	}
	canvas {
		/* Pixel art. The simulation is 256x240 and everything above it scales
		   by whole steps, so smoothing here would undo that. */
		image-rendering: pixelated;
		background: #05050c;
		max-width: 100%;
		max-height: 75vh;
		aspect-ratio: 256 / 240;
		border: 1px solid #1c1c2e;
	}
	#status { min-height: 1.5em; color: #6f6f8a; }
	kbd {
		background: #14142a;
		border: 1px solid #2a2a44;
		border-radius: 3px;
		padding: 0 .35em;
		color: #9a9ab8;
	}
	#keys { text-align: center; max-width: 48rem; }
</style>
</head>
<body>

<canvas id="canvas" tabindex="-1" width="256" height="240"
		oncontextmenu="event.preventDefault()"></canvas>

<div id="status">loading…</div>

<div id="keys">
	<p><strong>Cruiser</strong>
		<kbd>←</kbd><kbd>→</kbd> turn
		<kbd>↑</kbd> thrust
		<kbd>Right Ctrl</kbd> nuke
		<kbd>Right Shift</kbd> point defence</p>
	<p><strong>Avenger</strong>
		<kbd>A</kbd><kbd>D</kbd> turn
		<kbd>W</kbd> thrust
		<kbd>Left Ctrl</kbd> flame
		<kbd>Left Shift</kbd> cloak</p>
	<p><kbd>F1</kbd> collision overlay · <kbd>Esc</kbd> quit</p>
</div>

<script type="text/javascript">
	var statusEl = document.getElementById('status');
	var canvasEl = document.getElementById('canvas');

	var Module = {
		canvas: canvasEl,
		// Keep the keyboard on the canvas, or arrow keys scroll the page
		// instead of steering the ship.
		preRun: [function () {
			canvasEl.focus();
		}],
		print: function (text) { console.log(text); },
		printErr: function (text) { console.warn(text); },
		setStatus: function (text) {
			statusEl.textContent = text;
		},
		onRuntimeInitialized: function () {
			statusEl.textContent = 'click the canvas, then use the keys below';
			canvasEl.focus();
		},
	};

	canvasEl.addEventListener('click', function () { canvasEl.focus(); });

	// Arrow keys and space scroll the page by default, which fights the game
	// for every input. Swallow them while the canvas has focus.
	window.addEventListener('keydown', function (e) {
		if (document.activeElement === canvasEl
				&& ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ']
						.indexOf(e.key) !== -1) {
			e.preventDefault();
		}
	}, false);

	window.onerror = function (message) {
		statusEl.textContent = 'failed: ' + message;
	};
</script>

{{{ SCRIPT }}}

</body>
</html>
