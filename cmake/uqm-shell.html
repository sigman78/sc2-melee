<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Ur-Quan Masters</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #b9c6d2;
               font: 14px/1.5 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center;
         justify-content: center; }
  #canvas { background: #000; display: block; max-width: 100%;
            image-rendering: pixelated; outline: none; }
  #status { margin: 1rem 0 0; min-height: 1.5em; }
  #bar { width: min(640px, 90vw); height: 4px; background: #1b2733; margin-top: .5rem; }
  #bar > div { height: 100%; width: 0; background: #4a90d9; transition: width .2s; }
  /* stdout/stderr. Hidden: developer noise, and on a slow connection it is
     the first thing a player sees. Still written to, so ?log reveals it. */
  #log { display: none; width: min(640px, 90vw); max-height: 8em;
         overflow: auto; margin-top: 1rem;
         font-family: ui-monospace, monospace; font-size: 12px; color: #7c8b9a;
         white-space: pre-wrap; }
  #hint { margin: .75rem 0 0; font-size: 12px; color: #55636f; }
</style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <p id="status">Loading…</p>
  <div id="bar"><div></div></div>
  <p id="hint">Press F11 for fullscreen</p>
  <div id="log"></div>

<script>
  var statusEl = document.getElementById('status');
  var barEl = document.querySelector('#bar > div');
  var logEl = document.getElementById('log');

  // Developer escape hatch: ?log shows the console, uqmLog() reads it.
  if (/[?&]log/.test(location.search)) { logEl.style.display = 'block'; }
  window.uqmLog = function () { return logEl.textContent; };

  function note (text) {
    logEl.textContent += text + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }

  // Saves, teams and uqm.cfg live in /uqm, an IDBFS mount. Loading it is
  // asynchronous, so hold up startup with a run dependency until IndexedDB
  // has been read -- otherwise the game creates a fresh config every time.
  function mountPersistentHome () {
    FS.mkdir('/uqm');
    FS.mount(IDBFS, {}, '/uqm');
    Module.addRunDependency('idbfs-load');
    FS.syncfs(true, function (err) {
      if (err) { note('could not load saved data: ' + err); }
      Module.removeRunDependency('idbfs-load');
    });
  }

  // Write-back is asynchronous too and the game never tells us when it has
  // finished saving, so flush on a timer and once more on the way out.
  var flushPending = false;
  function flushPersistentHome () {
    if (flushPending) { return; }
    flushPending = true;
    FS.syncfs(false, function (err) {
      flushPending = false;
      if (err) { note('could not persist saved data: ' + err); }
    });
  }

  var Module = {
    canvas: (function () {
      var c = document.getElementById('canvas');
      // Emscripten's GL context loss handler wants this.
      c.addEventListener('webglcontextlost', function (e) {
        note('WebGL context lost');
        e.preventDefault();
      }, false);
      return c;
    })(),
    print: note,
    printErr: note,
    setStatus: function (text) {
      statusEl.textContent = text;
      var m = /([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/.exec(text);
      if (m) {
        barEl.style.width = (100 * parseFloat(m[2]) / parseFloat(m[4])) + '%';
      } else if (!text) {
        barEl.parentElement.style.visibility = 'hidden';
      }
    },
    totalDependencies: 0,
    monitorRunDependencies: function (left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      Module.setStatus(left
        ? 'Preparing… (' + (this.totalDependencies - left) +
          '/' + this.totalDependencies + ')'
        : '');
    },
    preRun: [mountPersistentHome],
    onRuntimeInitialized: function () {
      setInterval(flushPersistentHome, 5000);
      window.addEventListener('pagehide', flushPersistentHome);
      statusEl.textContent = 'Click the canvas, then use arrow keys and Enter.';
      document.getElementById('canvas').focus();
    }
  };
  Module.setStatus('Downloading…');
  window.onerror = function (msg) { note('error: ' + msg); };
</script>
{{{ SCRIPT }}}
</body>
</html>
